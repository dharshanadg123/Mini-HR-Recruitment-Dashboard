<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - HR Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background:#ecf0f1; }
    .container { width:350px; margin:80px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
    h2 { text-align:center; }
    input, select { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:10px; background:#27ae60; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#2ecc71; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <select required>
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="hr">HR</option>
      </select>
      <button type="submit">Register</button>
    </form>
    <p style="text-align:center;">Already have an account? <a href="signin.html">Sign in here</a></p>
  </div>
</body>
</html>
