<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - HR Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background:#ecf0f1; }
    .container { width:300px; margin:100px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
    h2 { text-align:center; }
    input { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:10px; background:#2c3e50; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#34495e; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sign In</h2>
    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <select required>
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="hr">HR</option>
      </select>
      <button type="submit">Login</button>
    </form>
    <p style="text-align:center;">Don't have an account? <a href="register.html">Register here</a></p>
  </div>
</body>
</html>
